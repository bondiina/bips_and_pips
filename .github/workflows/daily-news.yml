name: Daily official news monitor
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Check for new posts (bootstrap on first run)
        run: |
          if [ -f state.json ]; then
            python news_monitor.py --format markdown | tee latest-news.md
          else
            python news_monitor.py --bootstrap
            echo "# Official company news" > latest-news.md
            echo "Baseline created; subsequent runs report newly discovered links." >> latest-news.md
          fi
      - name: Persist monitoring state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json latest-news.md
          git diff --cached --quiet || git commit -m "chore: daily official news check"
          git push
